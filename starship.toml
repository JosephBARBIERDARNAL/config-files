format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$package\
$character
"""

add_newline = false

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold blue"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

conflicted = "!"
up_to_date = ""
untracked = "*"
stashed = ""
modified = "*"
staged = "*"
renamed = "*"
deleted = "*"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"

[nodejs]
format = " [$symbol($version)]($style)"
symbol = "⬢ "

[rust]
format = " [$symbol($version)]($style)"

[python]
format = " [$symbol($version)]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

[directory]
style = "bold cyan"

[package]
format = " [$symbol$version]($style)"
symbol = "pkg "

[bun]
format = " [$symbol($version)]($style)"

[deno]
format = " [$symbol($version)]($style)"

[rlang]
format = " [$symbol($version)]($style)"
symbol = "R "
